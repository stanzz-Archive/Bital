name: Build Orbital Strike Cannon

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Extract ZIP
    run: unzip -o OrbitalStrikeCannon.zip -d source

  - name: Build plugin
    run: mvn -B -f source/pom.xml clean package

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: OrbitalStrikeCannon
      path: source/target/*.jar
      if-no-files-found: error
