name: Build Orbital Strike Cannon

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: unzip -o OrbitalStrikeCannon.zip -d source

      - name: Find pom.xml
        run: |
          POM=$(find source -name pom.xml -print -quit)
          test -n "$POM" || exit 1
          echo "POM_PATH=$POM" >> "$GITHUB_ENV"

      - name: Build plugin
        run: mvn -B -f "$POM_PATH" clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: OrbitalStrikeCannon
          path: source/**/target/*.jar
          if-no-files-found: error
