name: Build Orbital Strike Cannon

on:
push:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Extract source
    run: |
      unzip -o OrbitalStrikeCannon.zip -d source

  - name: Find Maven project
    run: |
      POM=$(find source -name pom.xml -print -quit)
      if [ -z "$POM" ]; then
        echo "ERROR: pom.xml tidak ditemukan!"
        exit 1
      fi
      echo "POM_PATH=$POM" >> "$GITHUB_ENV"

  - name: Build plugin
    run: mvn -B -f "$POM_PATH" clean package

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: OrbitalStrikeCannon
      path: source/**/target/*.jar
      if-no-files-found: error
