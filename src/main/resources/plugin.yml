name: OrbitalStrikeCannon
version: 1.1.0
main: id.orbitalstrike.OrbitalStrikePlugin
api-version: '1.21.11'
author: OpenAI
description: Orbital TNT cannon and custom villager-style trading GUI.

commands:
orbital:
description: Gives the Orbital Strike Cannon fishing rod.
usage: /orbital
permission: orbital.use

orbitaltrade:
description: Opens the custom Orbital trading menu.
usage: /orbitaltrade
permission: orbital.trade

permissions:
orbital.use:
description: Allows the player to get and use the orbital cannon.
default: op

orbital.trade:
description: Allows the player to open the custom trading menu.
default: true
